
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <title>Sistema de inventario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-slate-100 text-slate-800">
    <div id="root"></div>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyCyOT9-KZaEH9QB8YPK18RL7XlWTyJdBTo",
        authDomain: "mantenimiento-menshen-e94ce.firebaseapp.com",
        projectId: "mantenimiento-menshen-e94ce",
        storageBucket: "mantenimiento-menshen-e94ce.firebasestorage.app",
        messagingSenderId: "1041705456217",
        appId: "1:1041705456217:web:41274cd0309be0e3e69748",
      };

      firebase.initializeApp(firebaseConfig);
      window.db = firebase.firestore();
      window.firestoreApi = {
        collection: (database, path) => database.collection(path),
        getDocs: (reference) => reference.get(),
        getDoc: (reference) => reference.get(),
        setDoc: (reference, data, options) => Promise.race([
          reference.set(data, options),
          new Promise((_, reject) => setTimeout(() => reject(new Error('Firebase no respondió en 10 segundos.')), 10000)),
        ]),
        deleteDoc: (reference) => reference.delete(),
        doc: (database, collectionName, documentId) => database.collection(collectionName).doc(documentId),
      };
    </script>

    <footer class="bg-slate-800 text-slate-200 py-4 mt-8">
      <div class="container mx-auto px-4 text-center text-sm">
        <img src="logo-removebg-preview.png" alt="Logo de Menshen" class="footer-logo" />
        © 2026 Menshen. Todos los derechos reservados.
      </div>
    </footer>

    <script type="text/babel" src="inventory-components.jsx?v=4"></script>
    <script type="text/babel" src="app.jsx?v=4"></script>
  </body>
</html>
